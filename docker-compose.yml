services:
  db:
    # Ships the pgvector extension preinstalled (Phase 1 needs it).
    image: pgvector/pgvector:pg17
    container_name: docsearch-db
    restart: unless-stopped
    environment:
      # The postgres image expects POSTGRES_*; the app speaks DB_*.
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Host 5433 -> container 5432. 5432 on this machine belongs to another
      # project's Postgres; the container always listens on 5432 internally.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ollama deliberately runs natively on the host, not as a service here:
  # the image bundles ~5GB of CUDA/ROCm runtimes this host cannot use (GT 710
  # is compute capability 3.5, Ollama needs 5.0+), and C: was too tight to
  # hold both it and the models. Models live on D: via OLLAMA_MODELS.

  web:
    build: .
    container_name: docsearch-web
    restart: unless-stopped
    env_file: .env
    environment:
      # Postgres answers to its service name; Ollama runs on the host, which
      # `extra_hosts` below makes reachable as host.docker.internal.
      DB_HOST: db
      DB_PORT: 5432
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # D2 - inside the container "localhost" is the container, so the
      # collector must be addressed by its compose service name.
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
    ports:
      - "8000:8000"
    volumes:
      # Bind mount for dev: edits on the host reload immediately.
      - .:/app
      # Docling downloads its layout/table models from HuggingFace on first
      # parse. Without this volume they live in the container's writable
      # layer and are re-downloaded every time the container is recreated —
      # minutes of wasted bandwidth on a slow link.
      - hfcache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  openwebui:
    # C3 — the chat frontend. Talks to our DRF API via a custom pipe (C4).
    image: ghcr.io/open-webui/open-webui:main
    container_name: docsearch-openwebui
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_PORT:-3000}:8080"
    environment:
      # No login wall: this is a local demo, and a signup screen between the
      # reviewer and the answer helps nobody.
      WEBUI_AUTH: "false"
      # Lets OpenWebUI also see the host's Ollama models directly, which is
      # handy for comparing raw model output against our RAG pipeline.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # C3 fix: OpenWebUI otherwise downloads its own sentence-transformers
      # model from HuggingFace at boot. That download is what filled the disk,
      # and it is pure waste here - retrieval happens in Django, not in the UI.
      RAG_EMBEDDING_ENGINE: "ollama"
      RAG_EMBEDDING_MODEL: "nomic-embed-text"
      # Hard guard so no HuggingFace fetch can happen at all.
      HF_HUB_OFFLINE: "1"
    volumes:
      - openwebui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  phoenix:
    # D1 - Arize Phoenix: OTLP collector + trace UI for every LLM call.
    image: arizephoenix/phoenix:latest
    container_name: docsearch-phoenix
    restart: unless-stopped
    ports:
      # 6006 serves both the browser UI and the OTLP/HTTP trace endpoint.
      - "${PHOENIX_PORT:-6006}:6006"
      # OTLP/gRPC, for exporters that prefer it over HTTP.
      - "4317:4317"
    volumes:
      # Without this, every restart loses the traces collected so far.
      - phoenix:/mnt/data
    environment:
      PHOENIX_WORKING_DIR: /mnt/data

volumes:
  pgdata:
  hfcache:
  openwebui:
  phoenix:
